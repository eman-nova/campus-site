<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GeeLux | Elevate Your Style</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="container header-flex">
        <div class="logo">GeeLux</div>
        <nav>
            <a href="home.html">Home</a>
            <a href="product.html">Products</a>
            <a href="order.html">Order</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<!-- ORDER SECTION -->
<section class="order" id="order">
    <div class="container">
        <h2>Place Your Order</h2>
        <p>Fill in your details and we’ll contact you to confirm your order.</p>

        <form class="order-form">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="tel" placeholder="Phone Number" required>

            <select required>
                <option value="">Select Product</option>
                <option>GeeLux Bracelet – ₦350,000</option>
                <option>GeeLux Ring – ₦700,000</option>
                <option>GeeLux Cuban Chain – ₦1,500,000</option>
            </select>

            <input type="number" placeholder="Quantity" min="1" required>

            <textarea placeholder="Delivery Address" rows="4" required></textarea>

            <button type="submit">Submit Order</button>
        </form>
    </div>
</section>
